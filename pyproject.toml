[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrsnappy"
version = "0.2.3"
description = "3D fluorescent puncta detection for microscopy z-stacks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Marco Rojas-Cessa"}
]
keywords = ["microscopy", "fluorescence", "puncta", "spot-detection", "bioimage-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-image>=0.21",
  "scikit-learn>=1.7.2,<1.8",
  "scipy>=1.10",
  "tifffile>=2023.7.10",
]

[project.urls]
Homepage = "https://github.com/marcorojas-cessa/SNAPpy"
Source = "https://github.com/marcorojas-cessa/SNAPpy"
Issues = "https://github.com/marcorojas-cessa/SNAPpy/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
]

[project.scripts]
mrsnappy = "mrsnappy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mrsnappy = [
  "resources/*.yaml",
]

[tool.ruff]
line-length = 120
target-version = "py310"
